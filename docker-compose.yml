services:

  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: gridprice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridprice_user
      POSTGRES_PASSWORD: gridprice_pass
      POSTGRES_DB: gridprice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m
    command: postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB

  # Redis
  redis:
    image: redis:7-alpine
    container_name: gridprice_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 64m
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru

  # pgAdmin - only start manually when needed
  pgadmin:
    image: dpage/pgadmin4
    container_name: gridprice_pgadmin
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gridprice.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    # volumes:
    # - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    # mem_limit: 512m
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  # pgadmin_data:
